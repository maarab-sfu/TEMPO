<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>VideoMind</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>VideoMind</h1>
        <span>Multimodal Video Intelligence</span>
    </header>

    <main>
        <section class="video-section">
            <div class="upload-panel">
            <h3>Upload a new video</h3>

            <form id="uploadForm">
                <input
                    id="videoFile"
                    type="file"
                    accept=".mp4,.mov,.mkv,.avi,.webm"
                    required
                >

                <button id="uploadButton" type="submit">
                    Upload and index
                </button>
            </form>

            <div
                id="uploadStatus"
                role="status"
                aria-live="polite"
            ></div>
        </div>
            <label for="videoSelect">Select a video</label>
            <select id="videoSelect">
                <option value="">Loading videos...</option>
            </select>

            <video id="videoPlayer" controls></video>

            <h3>Retrieved evidence</h3>
            <div id="evidence"></div>
        </section>

        <section class="chat-section">
            <h2>Ask about the video</h2>

            <div id="messages">
                <p class="placeholder">
                    Select a video and ask a question.
                </p>
            </div>

            <div>
                <label><input id="objectMode" type="checkbox"> Object-aware mode</label>
                <div id="objectReviewControls" hidden>
                    <label for="objectPhrase">Object to track</label>
                    <input id="objectPhrase" type="text" maxlength="120" placeholder="e.g. yellow toy car">
                    <label for="objectReviewMode">Review mode</label>
                    <select id="objectReviewMode">
                        <option value="events">Event review (up to 60 s)</option>
                        <option value="summary">Object summary</option>
                    </select>
                </div>
            </div>

            <form id="questionForm">
                <input
                    id="questionInput"
                    type="text"
                    placeholder="What happens in this video?"
                    required
                >
                <button id="askButton" type="submit">
                    Ask
                </button>
            </form>
        </section>
    </main>

    <script src="/static/app.js"></script>
    <script src="/static/object_mode.js?v=event-review-2"></script>
</body>
</html>
